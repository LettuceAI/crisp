name: Publish to npm

run-name: Publish ${{ github.event.release.tag_name || inputs.tag }}

# Runs when a GitHub release is published (by release.yml or by hand). Builds from
# the tagged commit and publishes @lettuceai/crisp with provenance. Needs the
# NPM_TOKEN repository secret (an npm automation token with publish rights).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.1.0"
        required: true
        type: string

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Setup Node (npm registry)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the tag matches package.json
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package.json version $VERSION" >&2
            exit 1
          fi

      - name: Build
        run: bun run build

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG_FLAG=""
          case "$VERSION" in *-*) TAG_FLAG="--tag next" ;; esac
          npm publish --access public --provenance $TAG_FLAG
